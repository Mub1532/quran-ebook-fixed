# Fixed 15-line IndoPak mushaf (Qudratullah grid) WITH tajweed colouring.
#
# Same canvas and grid as indopak_fxl.yaml; the difference is
# layout.tajweed, which colours the seven rules the Qudratullah mushaf
# marks (ikhfa, ikhfa meem saakin, idghaam, idghaam meem saakin, qalb,
# qalqala, ghunna) in that publisher's own palette, and prints the colour
# key across the bottom margin of facing pages.
#
# The rules live in data/tajweed_qudratullah.json and are applied
# directly to the IndoPak text -- every carrier they depend on (nun
# sakin, meem sakin, tanween, tashdeed) is written explicitly in that
# text, so nothing has to be mapped across from another orthography and
# no word is skipped. Edit the JSON to change the colouring; the code
# only applies whatever it declares.
#
# layout.tajweed_tanween is "mark" here: where a rule's carrier is a
# tanween, Qudratullah colours the MARK alone and leaves the letter under
# it black. Sibling config indopak_fxl_tajweed_letter.yaml colours the
# whole letter instead, which is another publisher's house style.
book:
  title: "القرآن الکریم"
  language: "ar"

quran:
  script: "text_indopak_nastaleeq"
  source: "quran_api"

font:
  arabic: "indopak_nastaleeq"

layout:
  structure: "indopak_fxl"
  tajweed: true
  tajweed_tanween: mark
  show_ayah_numbers: true
  show_bismillah: true

output:
  directory: "output"
  status: "experimental"
